# GitHub Actions iOS 构建配置
# 乘风计划 - 在 Windows 上通过 GitHub Actions 云端打包 IPA
# 费用：0 元（公开仓库免费，私有仓库每月 2000 分钟免费）
# 国内加速：修改 hosts 或使用 Ghips 工具

name: iOS Build

on:
  workflow_dispatch:  # 手动触发构建
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15  # 使用 macOS 15 (M1) Runner
    
    steps:
      - name: 克隆代码
        uses: actions/checkout@v4

      - name: 设置 Xcode 版本
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app
          xcodebuild -version

      - name: 构建 iOS App (Release)
        run: |
          cd ChengFengPlan_v2
          xcodebuild \
            -project ChengFengPlan.xcodeproj \
            -scheme ChengFengPlan \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $GITHUB_WORKSPACE/build/ChengFengPlan.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: 打包未签名 IPA
        run: |
          mkdir -p $GITHUB_WORKSPACE/build/Payload
          cp -R $GITHUB_WORKSPACE/build/ChengFengPlan.xcarchive/Products/Applications/ChengFengPlan.app $GITHUB_WORKSPACE/build/Payload/
          cd $GITHUB_WORKSPACE/build
          zip -r ChengFengPlan_unsigned.ipa Payload
          rm -rf Payload

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: ChengFengPlan-IPA
          path: build/ChengFengPlan_unsigned.ipa
          retention-days: 30

      - name: 构建完成提示
        run: echo "IPA 构建完成！请在 Actions 页面下载构建产物。"
