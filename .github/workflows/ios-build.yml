# GitHub Actions iOS 构建配置
# 乘风计划 - 云端打包 IPA

name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: 克隆代码
        uses: actions/checkout@v4

      - name: 查看目录结构
        run: ls -la

      - name: 设置 Xcode 版本
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks

      - name: 构建 iOS App (Release)
        run: |
          set -o pipefail
          xcodebuild \
            -project ChengFengPlan.xcodeproj \
            -scheme ChengFengPlan \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $GITHUB_WORKSPACE/build/ChengFengPlan.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee build.log

      - name: 上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: 打包未签名 IPA
        run: |
          mkdir -p $GITHUB_WORKSPACE/build/Payload
          cp -R $GITHUB_WORKSPACE/build/ChengFengPlan.xcarchive/Products/Applications/*.app $GITHUB_WORKSPACE/build/Payload/
          cd $GITHUB_WORKSPACE/build
          zip -r ChengFengPlan_unsigned.ipa Payload
          rm -rf Payload

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: ChengFengPlan-IPA
          path: build/ChengFengPlan_unsigned.ipa
          retention-days: 30
